<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Collection Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Guitar Collection Manager</h1>
    <div class="header-actions">
      <button id="btn-add-guitar" class="btn btn-primary">+ Add Guitar</button>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search guitars...">
      </div>
    </div>
  </header>

  <main>
    <div id="guitar-list" class="guitar-list">
      <p class="empty-message" id="empty-msg">No guitars in your collection yet. Click "+ Add Guitar" to get started.</p>
    </div>
  </main>

  <!-- Guitar Form Modal -->
  <div id="guitar-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add Guitar</h2>
        <button class="btn-close" id="btn-close-modal">&times;</button>
      </div>
      <form id="guitar-form">
        <input type="hidden" id="guitar-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="manufacturer">Manufacturer *</label>
            <input type="text" id="manufacturer" required placeholder="e.g. Fender, Gibson, Martin">
          </div>
          <div class="form-group">
            <label for="model">Model *</label>
            <input type="text" id="model" required placeholder="e.g. Stratocaster, Les Paul">
          </div>
          <div class="form-group">
            <label for="year">Year</label>
            <input type="number" id="year" min="1900" max="2099" placeholder="e.g. 2020">
          </div>
          <div class="form-group">
            <label for="serial-number">Serial Number</label>
            <input type="text" id="serial-number" placeholder="e.g. US12345678">
          </div>
          <div class="form-group">
            <label for="where-bought">Where Bought</label>
            <input type="text" id="where-bought" placeholder="e.g. Guitar Center, Reverb">
          </div>
          <div class="form-group">
            <label for="cost">Cost ($)</label>
            <input type="number" id="cost" min="0" step="0.01" placeholder="e.g. 1499.99">
          </div>
          <div class="form-group full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="3" placeholder="Any additional notes about this guitar..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-guitar">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-guitar">Save Guitar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Restring Modal -->
  <div id="restring-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="restring-modal-title">Log Restring</h2>
        <button class="btn-close" id="btn-close-restring">&times;</button>
      </div>
      <form id="restring-form">
        <input type="hidden" id="restring-guitar-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="string-maker">String Maker *</label>
            <input type="text" id="string-maker" required placeholder="e.g. Ernie Ball, D'Addario, Elixir">
          </div>
          <div class="form-group">
            <label for="string-gauge">Gauge *</label>
            <input type="text" id="string-gauge" required placeholder="e.g. 10-46, 11-52, Light">
          </div>
          <div class="form-group">
            <label for="string-material">Material *</label>
            <input type="text" id="string-material" required placeholder="e.g. Nickel Wound, Phosphor Bronze, 80/20">
          </div>
          <div class="form-group">
            <label for="restring-date">Date *</label>
            <input type="date" id="restring-date" required>
          </div>
          <div class="form-group full-width">
            <label for="restring-notes">Notes</label>
            <textarea id="restring-notes" rows="2" placeholder="How do they sound? Any observations..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-restring">Cancel</button>
          <button type="submit" class="btn btn-primary">Log Restring</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Guitar Detail Modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="detail-title">Guitar Details</h2>
        <button class="btn-close" id="btn-close-detail">&times;</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
        <button class="btn-close" id="btn-close-confirm">&times;</button>
      </div>
      <p id="confirm-message">Are you sure you want to delete this guitar?</p>
      <div class="form-actions">
        <button class="btn btn-secondary" id="btn-cancel-delete">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
