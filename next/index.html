<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the app use the whole screen, under the clock and home bar.
     user-scalable=no stops the browser zooming the page; the app does its own zoom on the court. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Penguins (preview)</title>

<!-- Home-screen app settings (iPhone/iPad) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penguins">
<meta name="theme-color" content="#151319">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="safe"></div>
<div id="lvhProbe"></div>   <!-- measures the full screen height; see physicalHeight() -->

<!-- ===================== TAB: PLAYBOOK =====================
     Hidden (not removed) when another tab is showing, so it keeps its drawing,
     zoom and tools exactly as you left them. -->
<div id="tab-playbook" class="tab">
<main id="stage">
  <canvas id="board"></canvas>
  <div id="scrim"></div>
  <div id="toast" class="glass"></div>

  <!-- Tools: swipe in from the right edge (or tap the tab); swipe back to hide -->
  <div id="drawer" class="closed">
    <button id="grab" aria-label="Show or hide tools"><span></span></button>
    <div id="rail" class="glass">
      <div class="courtseg" id="courtSeg" role="group" aria-label="Court">
        <span class="lens"></span>
        <button class="cs" data-court="full" aria-label="Full court"><span class="word">Full</span>
          <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M6 12h12"/><circle cx="12" cy="12" r="2.2"/></svg></button>
        <button class="cs" data-court="half" aria-label="Half court"><span class="word">Half</span>
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M6.5 5a5.5 5.5 0 0 0 11 0"/><circle cx="12" cy="7" r="1"/></svg></button>
      </div>
      <span class="sep"></span>
      <button class="tb" id="btnInk" aria-label="Board-color marker"><span class="dot"></span></button>
      <label class="tb rainbow" id="btnColor" aria-label="Pick a color">
        <span class="dot"><span></span></span>
        <input type="color" id="colorInput" value="#ffd84d">
      </label>
      <button class="tb" id="btnEraser" aria-label="Eraser">
        <svg viewBox="0 0 24 24"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/><path d="m8 8 8 8"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tb" id="btnUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tb" id="btnRedo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <button class="tb" id="btnClear" aria-label="Clear all"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button class="tb" id="btnSave" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></button>
      <button class="tb" id="btnMore" aria-label="More"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg></button>
    </div>
  </div>

  <!-- More: court, board color, line thickness, saved plays -->
  <div id="more" class="glass" hidden>
    <div id="playName">Untitled play</div>
    <div class="setting">Line
      <span class="line-adjust"><input type="range" id="widthRange" aria-label="Line thickness"><span id="widthPreview"></span></span>
    </div>
    <div class="setting">Board
      <div class="seg"><button data-theme="purple">Purple</button><button data-theme="white">White</button></div>
    </div>
    <button class="menu-btn" id="btnPlays">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Saved plays &amp; backup
    </button>
    <button class="menu-btn" id="btnFit">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit court to screen
    </button>
    <div id="version"></div>
    <a id="screenCheck" href="../screen-check.html">Screen check</a>
  </div>
</main>

<!-- Saved plays screen -->
<section id="plays" class="sheet" hidden>
  <header>
    <h1>Playbook</h1>
    <button class="pill-btn" id="btnClosePlays" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="actions">
    <button class="pill-btn" id="btnNew">New play</button>
    <button class="pill-btn" id="btnSaveAs">Save as new</button>
    <button class="pill-btn" id="btnExport">Export backup</button>
    <button class="pill-btn" id="btnImport">Import backup</button>
  </div>
  <p class="note">Plays are stored on this device only. Export a backup now and then — iOS can clear app data.</p>
  <div class="scrollable"><ul id="playList"></ul></div>
</section>
</div><!-- /tab-playbook -->

<!-- ===================== TAB: MINUTES =====================
     Placeholder until Stage 4 (playing-time tracker). -->
<div id="tab-minutes" class="tab tab-page" hidden>
  <div class="scrollable page-scroll">
    <div class="coming">
      <img src="../icon.svg" alt="" class="coming-logo">
      <h1>Minutes</h1>
      <p>Playing-time tracker — coming in the next stage.</p>
    </div>
  </div>
</div><!-- /tab-minutes -->

<!-- ===================== TAB SWITCHER =====================
     Floating glass pill at the bottom center. Add a button here (and a
     matching tab-… section above) to add a tab, e.g. Stats later. -->
<nav id="tabbar" class="glass" aria-label="Sections">
  <span class="lens"></span>
  <button class="tabbtn" data-tab="playbook">Playbook</button>
  <button class="tabbtn" data-tab="minutes">Minutes</button>
</nav>

<!-- One reusable pop-up for names and confirmations -->
<dialog id="modal" class="glass">
  <form id="modalForm">
    <h2 id="modalTitle"></h2>
    <p id="modalMsg"></p>
    <input id="modalInput" type="text" autocomplete="off" enterkeyhint="done" maxlength="60">
    <div class="buttons">
      <button type="button" id="modalCancel">Cancel</button>
      <button type="submit" id="modalOk" class="primary">OK</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<!-- Scripts: the Playbook first (its functions are shared), then the tab shell. -->
<script src="playbook.js"></script>
<script src="shell.js"></script>
</body>
</html>
